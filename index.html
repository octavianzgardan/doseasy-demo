<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DosEasy · Interactive demo</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #E9E9F0; }
  #stage { position: absolute; left: 50%; top: 50%; width: 1440px; height: 900px; transform-origin: center center; }
  #stage iframe { width: 1440px; height: 900px; border: 0; display: block; background: #F1F1F4; border-radius: 6px; box-shadow: 0 10px 40px rgba(17, 0, 121, 0.18); }
</style>
</head>
<body>
<div id="stage"><iframe src="app.html" title="DosEasy interactive demo"></iframe></div>
<script>
  (function () {
    var stage = document.getElementById('stage');
    function fit() {
      var pad = 16;
      var s = Math.min((window.innerWidth - pad) / 1440, (window.innerHeight - pad) / 900);
      stage.style.transform = 'translate(-50%, -50%) scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
  })();
</script>
</body>
</html>
